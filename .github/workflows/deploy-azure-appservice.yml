name: Deploy Azure App Service

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and Azure deployment environment.
        required: true
        type: string
      app_name:
        description: Application tag used to find the existing App Service.
        required: false
        type: string
        default: booking
      web_app_name:
        description: Existing App Service name. Defaults to tag-based discovery.
        required: false
        type: string
        default: ""
      resource_group:
        description: Azure resource group. Defaults to the RESOURCE_GROUP environment variable.
        required: false
        type: string
        default: ""
      dotnet_version:
        description: .NET SDK version to install.
        required: false
        type: string
        default: 10.0.x
      node_version:
        description: Node.js version to install.
        required: false
        type: string
        default: 22.x

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: azure-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    env:
      APP_NAME: ${{ vars.APP_NAME || inputs.app_name }}
      APP_HEALTH_TIMEOUT_SECONDS: ${{ vars.APP_HEALTH_TIMEOUT_SECONDS || '60' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DEPLOY_ENV: ${{ inputs.environment }}
      RESOURCE_GROUP: ${{ inputs.resource_group || vars.RESOURCE_GROUP }}
      WEB_APP_NAME_INPUT: ${{ inputs.web_app_name || vars.WEB_APP_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          # <deployment-settings:deploy-workflow-validation-env>
          ROSETTACLIENT__BASEURL: ${{ vars.ROSETTACLIENT__BASEURL }}
          ROSETTACLIENT__CLIENTID: ${{ vars.ROSETTACLIENT__CLIENTID }}
          ROSETTACLIENT__CLIENTSECRET: ${{ secrets.ROSETTACLIENT__CLIENTSECRET }}
          ROSETTACLIENT__TOKENURL: ${{ vars.ROSETTACLIENT__TOKENURL }}
          # </deployment-settings:deploy-workflow-validation-env>
        run: |
          set -euo pipefail

          if [[ "$DEPLOY_ENV" != "test" && "$DEPLOY_ENV" != "prod" ]]; then
            echo "environment must be either test or prod."
            exit 1
          fi

          missing=()
          for name in APP_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RESOURCE_GROUP; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Environment variable(s): %s\n' "${missing[*]}"
            exit 1
          fi

          if [[ ! "$APP_HEALTH_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "APP_HEALTH_TIMEOUT_SECONDS must be a positive integer."
            exit 1
          fi

          # <deployment-settings:workflow-required-checks>
          if [[ -z "$ROSETTACLIENT__BASEURL" ]]; then
            echo "ROSETTACLIENT__BASEURL must be configured as a GitHub Environment variable."
            exit 1
          fi

          if [[ -z "$ROSETTACLIENT__CLIENTID" ]]; then
            echo "ROSETTACLIENT__CLIENTID must be configured as a GitHub Environment variable."
            exit 1
          fi

          if [[ -z "$ROSETTACLIENT__CLIENTSECRET" ]]; then
            echo "ROSETTACLIENT__CLIENTSECRET must be configured as a GitHub Environment secret."
            exit 1
          fi

          if [[ -z "$ROSETTACLIENT__TOKENURL" ]]; then
            echo "ROSETTACLIENT__TOKENURL must be configured as a GitHub Environment variable."
            exit 1
          fi
          # </deployment-settings:workflow-required-checks>

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Restore frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Test frontend
        working-directory: client
        run: npm test -- --run

      - name: Restore .NET projects
        run: dotnet restore booking.sln

      - name: Build .NET projects
        run: dotnet build booking.sln --configuration Release --no-restore

      - name: Test .NET projects
        run: dotnet test booking.sln --configuration Release --no-build

      - name: Publish app
        run: dotnet publish server/server.csproj --configuration Release --output "$PWD/publish/web"

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          cd publish/web
          zip -qr ../booking.zip .

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve existing App Service
        id: resolve_app
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$WEB_APP_NAME_INPUT" ]]; then
            web_app_name="$WEB_APP_NAME_INPUT"
            az webapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$web_app_name" \
              --output none
          else
            mapfile -t web_apps < <(
              az webapp list \
                --resource-group "$RESOURCE_GROUP" \
                --output json |
                jq -r --arg app "$APP_NAME" --arg env "$DEPLOY_ENV" \
                  '.[] | select(.tags.application == $app and .tags.environment == $env) | .name'
            )

            if (( ${#web_apps[@]} != 1 )); then
              echo "Expected one App Service tagged application=$APP_NAME and environment=$DEPLOY_ENV in $RESOURCE_GROUP; found ${#web_apps[@]}."
              exit 1
            fi

            web_app_name="${web_apps[0]}"
          fi

          echo "web_app_name=$web_app_name" >> "$GITHUB_OUTPUT"

      - name: Apply runtime app settings
        shell: bash
        env:
          WEB_APP_NAME: ${{ steps.resolve_app.outputs.web_app_name }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          # <deployment-settings:workflow-env>
          AUTH_CALLBACK_PATH: ${{ vars.AUTH_CALLBACK_PATH || '/signin-oidc' }}
          AUTH_CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          AUTH_INSTANCE: ${{ vars.AUTH_INSTANCE || 'https://login.microsoftonline.com/' }}
          AUTH_TENANT_ID: ${{ vars.AUTH_TENANT_ID }}
          NOTIFICATION_BASE_URL: ${{ vars.NOTIFICATION_BASE_URL }}
          NOTIFICATION_DEFAULT_APP_NAME: ${{ vars.NOTIFICATION_DEFAULT_APP_NAME }}
          NOTIFICATION_DEFAULT_BUTTON_TEXT: ${{ vars.NOTIFICATION_DEFAULT_BUTTON_TEXT }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL || 'http/protobuf' }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          ROSETTACLIENT__BASEURL: ${{ vars.ROSETTACLIENT__BASEURL }}
          ROSETTACLIENT__CLIENTID: ${{ vars.ROSETTACLIENT__CLIENTID }}
          ROSETTACLIENT__CLIENTSECRET: ${{ secrets.ROSETTACLIENT__CLIENTSECRET }}
          ROSETTACLIENT__SCOPE: ${{ vars.ROSETTACLIENT__SCOPE }}
          ROSETTACLIENT__TOKENURL: ${{ vars.ROSETTACLIENT__TOKENURL }}
          SMTP_BCC_EMAIL: ${{ vars.SMTP_BCC_EMAIL }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_REPLY_TO_EMAIL: ${{ vars.SMTP_REPLY_TO_EMAIL }}
          SMTP_TIMEOUT: ${{ vars.SMTP_TIMEOUT }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          # </deployment-settings:workflow-env>
        run: |
          set -euo pipefail

          settings=(
            "ASPNETCORE_ENVIRONMENT=$DEPLOY_ENV"
            "WEBSITE_RUN_FROM_PACKAGE=1"
          )

          add_setting() {
            local name="$1"
            local value="$2"

            if [[ -n "$value" ]]; then
              settings+=("$name=$value")
            fi
          }

          add_setting "DB_CONNECTION" "$DB_CONNECTION"
          # <deployment-settings:workflow-runtime-settings>
          disabled_settings=(
          )

          if (( ${#disabled_settings[@]} > 0 )); then
            az webapp config appsettings delete \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEB_APP_NAME" \
              --setting-names "${disabled_settings[@]}" \
              --output none
          fi

          add_setting "Auth__CallbackPath" "$AUTH_CALLBACK_PATH"
          add_setting "Auth__ClientId" "$AUTH_CLIENT_ID"
          add_setting "Auth__Domain" "$AUTH_DOMAIN"
          add_setting "Auth__Instance" "$AUTH_INSTANCE"
          add_setting "Auth__TenantId" "$AUTH_TENANT_ID"
          add_setting "Notification__BaseUrl" "$NOTIFICATION_BASE_URL"
          add_setting "Notification__DefaultAppName" "$NOTIFICATION_DEFAULT_APP_NAME"
          add_setting "Notification__DefaultButtonText" "$NOTIFICATION_DEFAULT_BUTTON_TEXT"
          settings+=("OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT")
          add_setting "OTEL_EXPORTER_OTLP_HEADERS" "$OTEL_EXPORTER_OTLP_HEADERS"
          add_setting "OTEL_EXPORTER_OTLP_PROTOCOL" "$OTEL_EXPORTER_OTLP_PROTOCOL"
          add_setting "OTEL_RESOURCE_ATTRIBUTES" "$OTEL_RESOURCE_ATTRIBUTES"
          add_setting "OTEL_SERVICE_NAME" "$OTEL_SERVICE_NAME"
          add_setting "RosettaClient__BaseUrl" "$ROSETTACLIENT__BASEURL"
          add_setting "RosettaClient__ClientId" "$ROSETTACLIENT__CLIENTID"
          add_setting "RosettaClient__ClientSecret" "$ROSETTACLIENT__CLIENTSECRET"
          add_setting "RosettaClient__Scope" "$ROSETTACLIENT__SCOPE"
          add_setting "RosettaClient__TokenUrl" "$ROSETTACLIENT__TOKENURL"
          add_setting "Smtp__BccEmail" "$SMTP_BCC_EMAIL"
          add_setting "Smtp__FromEmail" "$SMTP_FROM_EMAIL"
          add_setting "Smtp__FromName" "$SMTP_FROM_NAME"
          add_setting "Smtp__Host" "$SMTP_HOST"
          add_setting "Smtp__Password" "$SMTP_PASSWORD"
          add_setting "Smtp__Port" "$SMTP_PORT"
          add_setting "Smtp__ReplyToEmail" "$SMTP_REPLY_TO_EMAIL"
          add_setting "Smtp__Timeout" "$SMTP_TIMEOUT"
          add_setting "Smtp__UseSsl" "$SMTP_USE_SSL"
          add_setting "Smtp__Username" "$SMTP_USERNAME"
          # </deployment-settings:workflow-runtime-settings>

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --settings "${settings[@]}" \
            --output none

      - name: Check SCM readiness
        shell: bash
        env:
          WEB_APP_NAME: ${{ steps.resolve_app.outputs.web_app_name }}
        run: |
          set -euo pipefail

          scm_url="https://${WEB_APP_NAME}.scm.azurewebsites.net/api/settings"
          ready_count=0

          for attempt in {1..12}; do
            scm_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$scm_url" || true)"

            if [[ "$scm_status" == "200" || "$scm_status" == "401" ]]; then
              ((ready_count += 1))
              if (( ready_count == 2 )); then
                echo "SCM is ready for package deployment."
                exit 0
              fi
            else
              ready_count=0
            fi

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "SCM is not ready for package deployment."
          exit 1

      - name: Deploy app package
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ steps.resolve_app.outputs.web_app_name }}
          package: publish/booking.zip

      - name: Verify application health
        shell: bash
        env:
          WEB_APP_NAME: ${{ steps.resolve_app.outputs.web_app_name }}
        run: |
          set -euo pipefail

          app_url="https://${WEB_APP_NAME}.azurewebsites.net/health"
          start_time=$SECONDS
          deadline=$((start_time + APP_HEALTH_TIMEOUT_SECONDS))
          ready_count=0
          attempt=0

          while (( SECONDS < deadline )); do
            ((attempt += 1))
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi

            request_timeout=$((remaining < 10 ? remaining : 10))
            app_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time "$request_timeout" "$app_url" || true)"
            elapsed=$((SECONDS - start_time))

            if [[ "$app_status" == "200" ]]; then
              ((ready_count += 1))
              if (( ready_count == 2 )); then
                echo "The deployed application is healthy after ${elapsed} seconds."
                exit 0
              fi
            else
              ready_count=0
              echo "Health check attempt $attempt returned HTTP ${app_status:-000} after ${elapsed} seconds."
            fi

            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi

            sleep_seconds=$((remaining < 5 ? remaining : 5))
            sleep "$sleep_seconds"
          done

          echo "The package was deployed, but the application did not become healthy within ${APP_HEALTH_TIMEOUT_SECONDS} seconds."
          exit 1
